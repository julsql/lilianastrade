name: Build & push image

# Lance les tests, puis construit l'image FrankenPHP/Symfony et la pousse sur GHCR (privee).
# Le deploiement est declenche par la CI : notification a Keel (webhook) apres le push.
# Sur les PR, seuls les tests tournent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # julsql/lilianastrade

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, zip, apcu
          tools: composer:v2
          coverage: none

      # .env n'est pas versionne (il contient les secrets) mais Symfony (bootEnv) l'exige.
      - name: Create .env placeholder
        run: printf 'APP_ENV=dev\nAPP_SECRET=ci\n' > .env

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync
        env:
          DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=18&charset=utf8

      - name: Run tests
        run: vendor/bin/phpunit

  build-push:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Keel to redeploy
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            https://keel.julsql.fr/v1/webhooks/native \
            -u "${{ secrets.KEEL_WEBHOOK_AUTH }}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ghcr.io/julsql/lilianastrade","tag":"latest"}'
